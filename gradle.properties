# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# Any 21.1.x build works, the newest ones are at https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.172
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# Parchment gives Minecraft's code readable names in the IDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata
mod_id=energydrinks
mod_name=Energy Drinks
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.m33rk4.energydrinks
mod_authors=M33RK4
mod_description=Adds colorful energy drink cans that give Speed and Haste - followed by an energy crash.
